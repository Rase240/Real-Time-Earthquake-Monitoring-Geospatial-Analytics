<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" width="780" height="240" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5a66"/></marker>
    <style>.t{font-size:11.5px;font-weight:600;fill:#1b2a35}.s{font-size:9.6px;fill:#4a5a66}.ln{stroke:#4a5a66;stroke-width:1.3}.b{fill:#fff;stroke:#6d3fd1}</style>
  </defs>
  <rect x="16" y="16" width="170" height="86" rx="6" fill="#fff6e5" stroke="#d08700"/><text x="26" y="36" class="t">download_catalog()</text><text x="26" y="52" class="s">USGS, M ≥ 4.5, 24 months</text><text x="26" y="66" class="s">30-day chunks, limit 20 000</text><text x="26" y="80" class="s">dedupe by id → CSV</text><text x="26" y="94" class="s">(--offline reuses CSV)</text>
  <rect x="210" y="16" width="170" height="86" rx="6" class="b"/><text x="220" y="36" class="t">build_dataset()</text><text x="220" y="52" class="s">causal_density (past 30 d)</text><text x="220" y="66" class="s">drop rows w/o mag or depth</text><text x="220" y="80" class="s">drop first 30 days (warm-up)</text><text x="220" y="94" class="s">plate_distance_km · label</text>
  <rect x="404" y="16" width="170" height="86" rx="6" class="b"/><text x="414" y="36" class="t">chronological_split()</text><text x="414" y="52" class="s">sort by time</text><text x="414" y="66" class="s">oldest 70 % → train</text><text x="414" y="80" class="s">next 15 % → validation</text><text x="414" y="94" class="s">newest 15 % → test</text>
  <rect x="598" y="16" width="166" height="86" rx="6" class="b"/><text x="608" y="36" class="t">StandardScaler</text><text x="608" y="52" class="s">fit on train only</text><text x="608" y="66" class="s">transform val + test</text><text x="608" y="80" class="s">(z = (x − μ) / σ)</text>
  <line x1="186" y1="59" x2="209" y2="59" class="ln" marker-end="url(#a)"/><line x1="380" y1="59" x2="403" y2="59" class="ln" marker-end="url(#a)"/><line x1="574" y1="59" x2="597" y2="59" class="ln" marker-end="url(#a)"/>
  <path d="M681 102 V122 H99 V136" fill="none" class="ln" marker-end="url(#a)"/>
  <rect x="16" y="138" width="170" height="86" rx="6" class="b"/><text x="26" y="158" class="t">train_nn()</text><text x="26" y="174" class="s">Adam lr 1e-3, wd 1e-4</text><text x="26" y="188" class="s">BCE loss, batch 256, seed 42</text><text x="26" y="202" class="s">early stop on val loss</text><text x="26" y="216" class="s">(patience 15) → best weights</text>
  <rect x="210" y="138" width="170" height="86" rx="6" class="b"/><text x="220" y="158" class="t">Baselines (train only)</text><text x="220" y="174" class="s">constant base rate</text><text x="220" y="188" class="s">5° regional rate (smoothed)</text><text x="220" y="202" class="s">logistic regression</text>
  <rect x="404" y="138" width="170" height="86" rx="6" class="b"/><text x="414" y="158" class="t">Evaluate on test</text><text x="414" y="174" class="s">ROC-AUC · avg precision</text><text x="414" y="188" class="s">Brier · log loss · skill</text><text x="414" y="202" class="s">threshold from validation</text><text x="414" y="216" class="s">confusion matrix · calibration</text>
  <rect x="598" y="138" width="166" height="86" rx="6" fill="#eaf6f4" stroke="#0e7d74"/><text x="608" y="158" class="t">Save artifacts</text><text x="608" y="174" class="s">earthquake_model_v1.pth</text><text x="608" y="188" class="s">scaler.pkl</text><text x="608" y="202" class="s">model_meta.json</text><text x="608" y="216" class="s">docs/model_evaluation.md</text>
