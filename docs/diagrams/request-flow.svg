<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#33434e"/></marker>
    <style>
      .h{font-size:11.5px;font-weight:700;fill:#fff}
      .m{font-size:10.2px;fill:#1b2a35}
      .life{stroke:#b8c6cf;stroke-width:1.2;stroke-dasharray:4 4}
      .call{stroke:#33434e;stroke-width:1.3;fill:none}
      .ret{stroke:#33434e;stroke-width:1.1;fill:none;stroke-dasharray:5 3}
    </style>
  </defs>
  <g>
    <rect x="20" y="12" width="100" height="30" rx="5" fill="#5b6b77"/><text x="70" y="32" text-anchor="middle" class="h">User</text>
    <rect x="165" y="12" width="130" height="30" rx="5" fill="#0e7d74"/><text x="230" y="32" text-anchor="middle" class="h">dashboard.js</text>
    <rect x="345" y="12" width="130" height="30" rx="5" fill="#3b5bdb"/><text x="410" y="32" text-anchor="middle" class="h">app.py (Flask)</text>
    <rect x="515" y="12" width="110" height="30" rx="5" fill="#6d3fd1"/><text x="570" y="32" text-anchor="middle" class="h">feed_cache</text>
    <rect x="660" y="12" width="100" height="30" rx="5" fill="#b26b00"/><text x="710" y="32" text-anchor="middle" class="h">USGS</text>
  </g>
  <line x1="70" y1="42" x2="70" y2="455" class="life"/><line x1="230" y1="42" x2="230" y2="455" class="life"/>
  <line x1="410" y1="42" x2="410" y2="455" class="life"/><line x1="570" y1="42" x2="570" y2="455" class="life"/><line x1="710" y1="42" x2="710" y2="455" class="life"/>

  <line x1="70" y1="70" x2="228" y2="70" class="call" marker-end="url(#a)"/><text x="78" y="64" class="m">1  clicks “7 days”</text>
  <path d="M230 90 h22 v14 h-20" class="call" marker-end="url(#a)"/><text x="258" y="101" class="m">2  abort previous request · status “Loading…”</text>
  <line x1="230" y1="128" x2="408" y2="128" class="call" marker-end="url(#a)"/><text x="236" y="122" class="m">3  GET /api/earthquakes?days=7&amp;min_mag=2.5</text>
  <path d="M410 146 h22 v14 h-20" class="call" marker-end="url(#a)"/><text x="438" y="157" class="m">4  parse_number(): days 1–30, min_mag −1–10</text>
  <line x1="410" y1="184" x2="568" y2="184" class="call" marker-end="url(#a)"/><text x="416" y="178" class="m">5  get(("feed", 7, 2.5))</text>
  <line x1="570" y1="208" x2="412" y2="208" class="ret" marker-end="url(#a)"/><text x="436" y="222" class="m">6  miss or older than 60 s</text>
  <line x1="410" y1="244" x2="708" y2="244" class="call" marker-end="url(#a)"/><text x="416" y="238" class="m">7  GET /query?starttime=…T…&amp;endtime=now&amp;orderby=time&amp;limit=2000</text>
  <line x1="710" y1="270" x2="412" y2="270" class="ret" marker-end="url(#a)"/><text x="520" y="284" class="m">8  GeoJSON FeatureCollection</text>
  <path d="M410 296 h22 v14 h-20" class="call" marker-end="url(#a)"/><text x="438" y="307" class="m">9  normalize_collection(): validate · dedupe</text>
  <line x1="410" y1="334" x2="568" y2="334" class="call" marker-end="url(#a)"/><text x="416" y="328" class="m">10  put(key, payload)</text>
  <line x1="410" y1="362" x2="232" y2="362" class="ret" marker-end="url(#a)"/><text x="244" y="376" class="m">11  200 {events, count, cache, …}</text>
  <path d="M230 392 h22 v14 h-20" class="call" marker-end="url(#a)"/><text x="258" y="403" class="m">12  normalizeEvents → filterByDepth → render*</text>
  <line x1="230" y1="436" x2="72" y2="436" class="ret" marker-end="url(#a)"/><text x="84" y="430" class="m">13  map, list, metrics</text>
  <text x="440" y="440" class="m" fill="#5b6b77">On a cache hit, steps 7–10 are skipped. If step 7 fails,</text>
  <text x="440" y="454" class="m" fill="#5b6b77">a copy ≤ 30 min old is returned with cache.stale = true.</text>
</svg>
