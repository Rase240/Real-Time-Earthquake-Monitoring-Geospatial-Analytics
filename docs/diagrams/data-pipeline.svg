<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5a66"/></marker>
    <style>.t{font-size:11.5px;font-weight:600;fill:#1b2a35}.s{font-size:9.6px;fill:#4a5a66}.ln{stroke:#4a5a66;stroke-width:1.3}</style>
  </defs>
  <text x="16" y="22" font-size="11px" font-weight="700" fill="#3b5bdb">SERVER (Python)</text>
  <rect x="16" y="32" width="170" height="72" rx="6" fill="#fff6e5" stroke="#d08700"/><text x="26" y="52" class="t">USGS GeoJSON</text><text x="26" y="68" class="s">FeatureCollection</text><text x="26" y="82" class="s">coordinates = [lon, lat, depth]</text><text x="26" y="96" class="s">properties.time = epoch ms</text>
  <rect x="210" y="32" width="170" height="72" rx="6" fill="#fff" stroke="#3b5bdb"/><text x="220" y="52" class="t">normalize_feature()</text><text x="220" y="68" class="s">finite + in-range lat/lon</text><text x="220" y="82" class="s">time required · optional → None</text><text x="220" y="96" class="s">flat dict, time_iso added</text>
  <rect x="404" y="32" width="170" height="72" rx="6" fill="#fff" stroke="#3b5bdb"/><text x="414" y="52" class="t">normalize_collection()</text><text x="414" y="68" class="s">drop invalid (counted)</text><text x="414" y="82" class="s">de-duplicate by id</text><text x="414" y="96" class="s">malformed → UpstreamError</text>
  <rect x="598" y="32" width="166" height="72" rx="6" fill="#fff" stroke="#3b5bdb"/><text x="608" y="52" class="t">/api/earthquakes</text><text x="608" y="68" class="s">+ truncated, total_available</text><text x="608" y="82" class="s">+ query, fetched_at</text><text x="608" y="96" class="s">+ cache {hit, age, stale}</text>
  <line x1="186" y1="68" x2="209" y2="68" class="ln" marker-end="url(#a)"/><line x1="380" y1="68" x2="403" y2="68" class="ln" marker-end="url(#a)"/><line x1="574" y1="68" x2="597" y2="68" class="ln" marker-end="url(#a)"/>
  <path d="M681 104 V128 H99 V150" fill="none" class="ln" marker-end="url(#a)"/>
  <text x="300" y="122" class="s">JSON over HTTP (same origin)</text>
  <text x="16" y="146" font-size="11px" font-weight="700" fill="#0e7d74">BROWSER (JavaScript)</text>
  <rect x="16" y="152" width="170" height="72" rx="6" fill="#fff" stroke="#0e7d74"/><text x="26" y="172" class="t">fetchJson()</text><text x="26" y="188" class="s">25 s timeout · abortable</text><text x="26" y="202" class="s">non-2xx → Error(body.error)</text><text x="26" y="216" class="s">invalid JSON → Error</text>
  <rect x="210" y="152" width="170" height="72" rx="6" fill="#fff" stroke="#0e7d74"/><text x="220" y="172" class="t">core.normalizeEvents()</text><text x="220" y="188" class="s">re-validate coordinates/time</text><text x="220" y="202" class="s">USGS-only URLs kept</text><text x="220" y="216" class="s">depth_km → depth</text>
  <rect x="404" y="152" width="170" height="72" rx="6" fill="#fff" stroke="#0e7d74"/><text x="414" y="172" class="t">core.filterByDepth()</text><text x="414" y="188" class="s">all · shallow &lt; 70 km</text><text x="414" y="202" class="s">intermediate 70–300 km</text><text x="414" y="216" class="s">deep &gt; 300 km</text>
  <rect x="598" y="152" width="166" height="72" rx="6" fill="#eaf6f4" stroke="#0e7d74"/><text x="608" y="172" class="t">Render</text><text x="608" y="188" class="s">summarize() → metrics/charts</text><text x="608" y="202" class="s">renderMarkers() · renderList()</text><text x="608" y="216" class="s">renderDetail() on selection</text>
  <line x1="186" y1="188" x2="209" y2="188" class="ln" marker-end="url(#a)"/><line x1="380" y1="188" x2="403" y2="188" class="ln" marker-end="url(#a)"/><line x1="574" y1="188" x2="597" y2="188" class="ln" marker-end="url(#a)"/>
  <text x="16" y="244" class="s">Validation happens twice on purpose: the server protects every client; the browser protects itself against a malformed or partial response.</text>
</svg>
