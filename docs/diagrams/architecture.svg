<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5a66"/></marker>
    <style>
      .t{font-size:12px;font-weight:600;fill:#1b2a35}
      .s{font-size:10px;fill:#4a5a66}
      .g{font-size:13px;font-weight:700}
      .ln{stroke:#4a5a66;stroke-width:1.3;fill:none}
      .box{fill:#fff;stroke:#b8c6cf;stroke-width:1}
      .lbl{font-size:9.5px;fill:#4a5a66;font-style:italic}
    </style>
  </defs>
  <!-- Browser -->
  <rect x="14" y="14" width="236" height="338" rx="8" fill="#eaf6f4" stroke="#0e7d74" stroke-width="1.5"/>
  <text x="28" y="36" class="g" fill="#0e7d74">Browser</text>
  <rect x="28" y="46" width="208" height="40" rx="5" class="box"/><text x="38" y="63" class="t">templates/index.html</text><text x="38" y="78" class="s">six module tabs · forms · panes</text>
  <rect x="28" y="92" width="208" height="40" rx="5" class="box"/><text x="38" y="109" class="t">static/dashboard.js</text><text x="38" y="124" class="s">Live Monitor · map · fetchJson · TerraApp</text>
  <rect x="28" y="138" width="208" height="54" rx="5" class="box"/><text x="38" y="155" class="t">static/ml.js</text><text x="38" y="170" class="s">Sequences · Forecasts · Anomalies</text><text x="38" y="184" class="s">Aftershocks · Model Performance</text>
  <rect x="28" y="198" width="208" height="54" rx="5" class="box"/><text x="38" y="215" class="t">core.js · analytics.js · charts.js</text><text x="38" y="230" class="s">pure: validation, supersession,</text><text x="38" y="244" class="s">explanations, SVG charts (Node-tested)</text>
  <rect x="28" y="258" width="208" height="80" rx="5" class="box"/><text x="38" y="275" class="t">Leaflet map</text><text x="38" y="290" class="s">events · activity cells · plates</text><text x="38" y="304" class="s">module layer: sequences, forecast</text><text x="38" y="318" class="s">cells, flagged cells, aftershock</text><text x="38" y="332" class="s">circle + events</text>

  <!-- Flask -->
  <rect x="284" y="14" width="250" height="338" rx="8" fill="#eef1fb" stroke="#3d55c4" stroke-width="1.5"/>
  <text x="298" y="36" class="g" fill="#3d55c4">Flask process (app.py)</text>
  <rect x="298" y="46" width="222" height="96" rx="5" class="box"/><text x="308" y="63" class="t">Routes (validated, JSON errors)</text>
  <text x="308" y="78" class="s">/api/earthquakes · /api/sequences</text><text x="308" y="92" class="s">/api/forecast[/cell] · /api/anomalies[/cell]</text><text x="308" y="106" class="s">/api/aftershocks · /api/model-performance</text><text x="308" y="120" class="s">/api/health · /api/predict (legacy)</text><text x="308" y="134" class="s">/api/hotspots · /api/plates</text>
  <rect x="298" y="148" width="222" height="56" rx="5" class="box"/><text x="308" y="165" class="t">feed_cache (single-flight)</text><text x="308" y="180" class="s">feed 60 s · history 1 h · radius 10 min</text><text x="308" y="194" class="s">labelled stale fallback</text>
  <rect x="298" y="210" width="222" height="42" rx="5" class="box"/><text x="308" y="227" class="t">analysis_cache</text><text x="308" y="242" class="s">key = data version + all parameters</text>
  <rect x="298" y="258" width="222" height="80" rx="5" class="box"/><text x="308" y="275" class="t">analytics/</text><text x="308" y="290" class="s">catalog · geo · regions · regional_features</text><text x="308" y="304" class="s">sequences (A) · forecast (B)</text><text x="308" y="318" class="s">anomaly (C) · aftershock (D)</text><text x="308" y="332" class="s">usgs_client.py → USGS</text>

  <!-- USGS -->
  <rect x="580" y="30" width="206" height="96" rx="8" fill="#fff6e8" stroke="#c77700" stroke-width="1.5"/>
  <text x="594" y="52" class="g" fill="#c77700">USGS FDSN event service</text>
  <text x="594" y="70" class="s">feed: last 1–30 days, any M</text><text x="594" y="84" class="s">history: 400 days, global M4.5+</text><text x="594" y="98" class="s">eventid lookup · maxradiuskm query</text><text x="594" y="112" class="s">public, no key</text>

  <!-- Artifacts -->
  <rect x="580" y="148" width="206" height="124" rx="8" fill="#f4f4f4" stroke="#6b7780" stroke-width="1.2"/>
  <text x="594" y="170" class="g" fill="#47525a">models/ (loaded at start)</text>
  <text x="594" y="188" class="s">forecast_m4.5 / m5.0 .joblib + .json</text><text x="594" y="202" class="s">anomaly_reference.json (dispersion)</text><text x="594" y="216" class="s">*_eval.json · forecast_backtest.json</text><text x="594" y="230" class="s">legacy: earthquake_model_v1.pth,</text><text x="594" y="244" class="s">scaler.pkl, model_meta.json</text><text x="594" y="258" class="s">data/tectonic_plates.geojson</text>

  <!-- Offline -->
  <rect x="284" y="384" width="502" height="100" rx="8" fill="#fbf0f3" stroke="#b03a5b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="298" y="406" class="g" fill="#b03a5b">Offline (run by hand, never by the web app)</text>
  <text x="298" y="426" class="s">ml_pipeline.py download → data/history_catalog.csv (2000 → last Monday, M4.5+, chunked, gap-free)</text>
  <text x="298" y="442" class="s">ml_pipeline.py forecast · anomaly · sequences · aftershock · all → models/*.json, *.joblib</text>
  <text x="298" y="458" class="s">analytics/report.py → docs/ml_evaluation.md    ·    train_model.py → legacy classifier</text>
  <text x="298" y="474" class="s">docs/build_guide.py → docs/learning-guide.pdf (excerpts verified against the source)</text>

  <!-- arrows -->
  <path class="ln" d="M250 120 H284" marker-end="url(#a)"/><text x="252" y="113" class="lbl">GET /api/*</text>
  <path class="ln" d="M520 300 C 556 300 556 90 580 90" marker-end="url(#a)"/><text x="540" y="140" class="lbl">HTTPS</text>
  <path class="ln" d="M580 210 H520" marker-end="url(#a)"/>
  <path class="ln" d="M660 384 V272" marker-end="url(#a)"/><text x="666" y="330" class="lbl">writes</text>
  <path class="ln" d="M740 384 V126" marker-end="url(#a)"/><text x="746" y="300" class="lbl">downloads</text>
</svg>
