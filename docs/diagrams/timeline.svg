<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5a66"/></marker>
    <style>.s{font-size:10px;fill:#33434e}.w{font-size:10.5px;font-weight:600;fill:#fff}.d{font-size:9.2px;fill:#5b6b77}</style>
  </defs>
  <text x="40" y="20" font-size="12px" font-weight="700" fill="#1b2a35">Chronological split of the current artifacts (newest data on the right)</text>
  <rect x="40" y="34" width="30" height="34" fill="#c9d3da"/>
  <rect x="70" y="34" width="467" height="34" fill="#0e7d74"/><text x="300" y="56" text-anchor="middle" class="w">train · 10 753 samples · 25.2 % ≥ M5</text>
  <rect x="537" y="34" width="107" height="34" fill="#3b5bdb"/><text x="590" y="56" text-anchor="middle" class="w">val · 2 304</text>
  <rect x="644" y="34" width="96" height="34" fill="#6d3fd1"/><text x="692" y="56" text-anchor="middle" class="w">test · 2 305</text>
  <text x="40" y="84" class="d">2024-10-28</text><text x="70" y="96" class="d">2024-11-28</text>
  <text x="537" y="84" text-anchor="middle" class="d">2026-03-23</text><text x="644" y="84" text-anchor="middle" class="d">2026-07-11</text><text x="740" y="84" text-anchor="end" class="d">2026-10-18</text>
  <text x="40" y="110" class="d">grey = 30-day warm-up (catalogue only; no samples, because the look-back window would be incomplete)</text>

  <text x="40" y="140" font-size="12px" font-weight="700" fill="#1b2a35">How local_density_30d is computed for one event at time t</text>
  <line x1="40" y1="190" x2="740" y2="190" stroke="#4a5a66" stroke-width="1.3" marker-end="url(#a)"/><text x="744" y="194" class="d">time</text>
  <rect x="300" y="156" width="300" height="34" fill="#e3f3f1" stroke="#0e7d74"/>
  <text x="450" y="169" text-anchor="middle" class="s">counted: t − 30 days ≤ time &lt; t, within ±1° box</text>
  <line x1="600" y1="150" x2="600" y2="200" stroke="#b42318" stroke-width="2"/><text x="600" y="214" text-anchor="middle" font-size="10px" font-weight="700" fill="#b42318">t (the event itself: not counted)</text>
  <text x="300" y="214" text-anchor="middle" class="d">t − 30 d</text>
  <circle cx="340" cy="182" r="4" fill="#0e7d74"/><circle cx="420" cy="182" r="4" fill="#0e7d74"/><circle cx="560" cy="182" r="4" fill="#0e7d74"/>
  <circle cx="200" cy="182" r="4" fill="#9aa9b3"/><text x="200" y="170" text-anchor="middle" class="d">too old</text>
  <circle cx="660" cy="182" r="4" fill="#9aa9b3"/><circle cx="700" cy="182" r="4" fill="#9aa9b3"/><text x="680" y="170" text-anchor="middle" class="d">future: never used</text>
</svg>
