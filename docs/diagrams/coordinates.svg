<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" width="780" height="270" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>.t{font-size:11.5px;font-weight:700;fill:#1b2a35}.s{font-size:9.8px;fill:#33434e}.m{font-size:9.6px;font-family:Consolas,monospace;fill:#1b2a35}.grid{stroke:#d5dee4;stroke-width:0.8}</style>
  </defs>
  <!-- Left: equirectangular grid 360x180 scaled to 340x170 -->
  <text x="16" y="18" class="t">Coordinate order: GeoJSON vs Leaflet</text>
  <rect x="16" y="28" width="340" height="170" fill="#f7fafb" stroke="#9aa9b3"/>
  <g class="grid">
    <line x1="16" y1="113" x2="356" y2="113" stroke="#9aa9b3"/><line x1="186" y1="28" x2="186" y2="198" stroke="#9aa9b3"/>
    <line x1="16" y1="70.5" x2="356" y2="70.5"/><line x1="16" y1="155.5" x2="356" y2="155.5"/>
    <line x1="101" y1="28" x2="101" y2="198"/><line x1="271" y1="28" x2="271" y2="198"/>
  </g>
  <text x="190" y="125" class="s" fill="#7f95a3">0°, 0°</text>
  <text x="20" y="40" class="s" fill="#7f95a3">90°N</text><text x="20" y="194" class="s" fill="#7f95a3">90°S</text><text x="320" y="194" class="s" fill="#7f95a3">180°E</text>
  <!-- Chile correct: lon -70.6 lat -33.4 → x = 186 + (-70.6)*340/360 = 119.3 ; y = 113 + 33.4*170/180 = 144.5 -->
  <circle cx="119.3" cy="144.5" r="5" fill="#0e7d74"/><text x="60" y="140" class="s" fill="#0e7d74">correct</text>
  <!-- swapped: lat=-70.6, lon=-33.4 → x = 186 - 31.5 = 154.5 ; y = 113 + 66.7 = 179.7 -->
  <circle cx="154.5" cy="179.7" r="5" fill="none" stroke="#b42318" stroke-width="2"/><text x="164" y="183" class="s" fill="#b42318">swapped (near Antarctica)</text>
  <text x="16" y="216" class="m" font-size="9px">USGS:    coordinates [-70.6, -33.4, 35.0]  // lon, lat, depth</text>
  <text x="16" y="231" class="m" font-size="9px">Leaflet: L.circleMarker([lat, lon])</text>
  <text x="16" y="248" class="s">Converted once, by name, in normalize_feature();</text><text x="16" y="262" class="s">the browser only sees named latitude/longitude fields.</text>

  <!-- Right: antimeridian -->
  <text x="400" y="18" class="t">Longitude wrap at the antimeridian (±180°)</text>
  <line x1="400" y1="110" x2="764" y2="110" stroke="#9aa9b3"/>
  <line x1="582" y1="60" x2="582" y2="160" stroke="#b42318" stroke-dasharray="4 3"/><text x="582" y="54" text-anchor="middle" class="s" fill="#b42318">180° = −180°</text>
  <circle cx="560" cy="110" r="5" fill="#0e7d74"/><text x="560" y="132" text-anchor="middle" class="m">179.9°</text>
  <circle cx="604" cy="110" r="5" fill="#3b5bdb"/><text x="604" y="132" text-anchor="middle" class="m">−179.9°</text>
  <path d="M560 96 Q582 80 604 96" fill="none" stroke="#0e7d74" stroke-width="1.5"/><text x="582" y="78" text-anchor="middle" class="s" fill="#0e7d74">0.2° apart</text>
  <text x="400" y="176" class="m">naive:   |179.9 − (−179.9)| = 359.8°   ✗</text>
  <text x="400" y="192" class="m">wrapped: ((Δ + 180) mod 360) − 180 = −0.2°  ✓</text>
  <text x="400" y="216" class="s">features.wrap_lon() is applied in both plate_distance_km()</text>
  <text x="400" y="231" class="s">and causal_density(), so Fiji/Tonga/Aleutian events near ±180°</text>
  <text x="400" y="246" class="s">get correct distances and neighbour counts.</text>
</svg>
