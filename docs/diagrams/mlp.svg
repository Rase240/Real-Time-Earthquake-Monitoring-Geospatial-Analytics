  <rect x="382" y="20" width="64" height="130" rx="5" fill="#f3effc" stroke="#6d3fd1"/><text x="414" y="78" text-anchor="middle" class="t">BatchNorm</text><text x="414" y="94" text-anchor="middle" class="s">64</text>
