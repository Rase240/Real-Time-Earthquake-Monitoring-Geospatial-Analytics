  </defs>
  <rect x="14" y="60" width="72" height="50" rx="5" fill="#eaf6f4" stroke="#0e7d74"/><text x="50" y="82" text-anchor="middle" class="t">input</text><text x="50" y="97" text-anchor="middle" class="s">5 scaled</text>
